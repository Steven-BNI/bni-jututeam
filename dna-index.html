<style>
:root {
  --red: #E8001D;
  --gold: #C9A84C;
  --gold-light: #e8c878;
  --gold-dim: rgba(201,168,76,0.15);
  --gold-border: rgba(201,168,76,0.35);
  --bg: #0d0d14;
  --surface: #13131f;
  --surface2: #1a1a28;
  --border: rgba(255,255,255,0.08);
  --border-gold: rgba(201,168,76,0.3);
  --white: #ffffff;
  --text: #f0ede6;
  --muted: #7a7a99;
  --green: #3dba8a;
  --green-bg: rgba(61,186,138,0.12);
  --yellow: #e6a030;
  --yellow-bg: rgba(230,160,48,0.12);
  --red-bg: rgba(232,0,29,0.12);
  --gray-bg: rgba(255,255,255,0.06);
  --gray-text: #555570;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; }

.header { background: var(--surface); padding: 20px 20px 18px; position: relative; overflow: hidden; border-bottom: 1px solid var(--border-gold); }
.header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%); }
.header::after { content: 'DNA'; position: absolute; right: -10px; top: -10px; font-family: 'Oswald', sans-serif; font-size: 90px; font-weight: 700; color: rgba(201,168,76,0.05); pointer-events: none; line-height: 1; }
.header-eyebrow { font-size: 10px; letter-spacing: 3px; color: var(--gold); font-weight: 700; margin-bottom: 6px; font-family: 'Oswald', sans-serif; }
.header h1 { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; line-height: 1.3; }
.header h1 em { color: var(--gold); font-style: normal; }
.header-sub { font-size: 17px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }

/* SYNC STATUS */
.sync-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 8px; font-size: 17px; color: var(--muted); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray-text); flex-shrink: 0; }
.sync-dot.ok { background: var(--green); }
.sync-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.month-bar { background: var(--surface); border-bottom: 1px solid var(--border-gold); display: flex; overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.month-bar::-webkit-scrollbar { display: none; }
.month-tab { flex-shrink: 0; padding: 12px 16px; font-size: 16px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; transition: all 0.2s; white-space: nowrap; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; }
.month-tab:hover { color: var(--gold-light); }
.month-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

.member-bar { padding: 14px 16px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
.member-bar-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.member-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.member-scroll::-webkit-scrollbar { display: none; }
.member-btn { flex-shrink: 0; padding: 7px 13px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; font-family: 'Noto Sans TC', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.member-btn .m-name { font-size: 17px; }
.member-btn .m-role { font-size: 9px; color: var(--muted); font-weight: 400; }
.member-btn:hover { border-color: var(--gold-border); color: var(--gold-light); }
.member-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
.member-btn.active .m-role { color: rgba(201,168,76,0.6); }
.member-btn.locked { opacity: 0.3; cursor: default; }

.overview { margin: 14px 16px; background: var(--surface); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; border-left: 4px solid var(--green); border: 1.5px solid var(--border); border-left: 4px solid var(--green); }
.overview.warn { border-left-color: var(--yellow); }
.overview.danger { border-left-color: var(--red); }
.overview.na { border-left-color: var(--gray-text); }
.overview-score { font-family: 'Oswald', sans-serif; font-size: 36px; font-weight: 700; color: var(--green); line-height: 1; }
.overview.warn .overview-score { color: var(--yellow); }
.overview.danger .overview-score { color: var(--red); }
.overview-score span { font-size: 16px; color: var(--muted); }
.overview-info { flex: 1; }
.overview-name { font-size: 17px; font-weight: 900; color: var(--text); }
.overview-role { font-size: 17px; color: var(--muted); margin-bottom: 4px; }
.overview-status { font-size: 16px; font-weight: 700; color: var(--green); }
.overview.warn .overview-status { color: var(--yellow); }
.overview.danger .overview-status { color: var(--red); }

.section-label { padding: 16px 16px 8px; font-size: 10px; letter-spacing: 3px; color: var(--gold); font-weight: 700; font-family: 'Oswald', sans-serif; }
.cards { padding: 0 16px 30px; display: flex; flex-direction: column; gap: 10px; }

.fcard { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid var(--border); transition: border-color 0.2s, box-shadow 0.2s; animation: slideUp 0.25s ease both; }
.fcard:nth-child(2){animation-delay:0.04s}.fcard:nth-child(3){animation-delay:0.08s}.fcard:nth-child(4){animation-delay:0.12s}.fcard:nth-child(5){animation-delay:0.16s}
.fcard:hover { border-color: var(--border-gold); box-shadow: var(--shadow-lg); }
.fcard-head { padding: 13px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.fcard-num { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--gold); width: 24px; flex-shrink: 0; }
.fcard-info { flex: 1; min-width: 0; }
.fcard-title { font-size: 16px; font-weight: 900; margin-bottom: 2px; color: var(--text); }
.fcard-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
.fcard-badge { padding: 4px 10px; border-radius: 20px; font-size: 17px; font-weight: 700; flex-shrink: 0; }
.badge-ok { background: var(--green-bg); color: var(--green); }
.badge-warn { background: var(--yellow-bg); color: var(--yellow); }
.badge-danger { background: var(--red-bg); color: var(--red); }
.badge-na { background: var(--gray-bg); color: var(--muted); }
.fcard-chevron { color: var(--muted); font-size: 16px; margin-left: 6px; transition: transform 0.2s; flex-shrink: 0; }
.fcard.open .fcard-chevron { transform: rotate(180deg); }
.fcard-body { display: none; border-top: 1px solid var(--border); }
.fcard.open .fcard-body { display: block; }
.fcard-body-inner { padding: 14px 14px 16px 50px; }

.input-label { font-size: 17px; color: var(--muted); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.5px; }
.toggle-row { display: flex; gap: 8px; }
.toggle-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2); font-size: 17px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; text-align: center; color: var(--muted); }
.toggle-btn:hover { border-color: var(--border-gold); }
.toggle-btn.sel-yes { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.toggle-btn.sel-no { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.light-row { display: flex; gap: 6px; }
.light-btn { flex: 1; padding: 8px 4px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2); font-size: 16px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; text-align: center; color: var(--muted); }
.light-btn:hover { border-color: var(--border-gold); }
.light-btn.sel-green { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.light-btn.sel-yellow { background: var(--yellow-bg); border-color: var(--yellow); color: var(--yellow); }
.light-btn.sel-red { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.light-btn.sel-gray { background: var(--gray-bg); border-color: rgba(255,255,255,0.15); color: var(--muted); }
.text-input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2); font-size: 17px; font-family: 'Noto Sans TC', sans-serif; color: var(--text); outline: none; transition: border-color 0.2s; }
.text-input:focus { border-color: var(--gold-border); }
.num-row { display: flex; gap: 8px; align-items: center; }
.num-input { width: 80px; padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2); font-size: 16px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; color: var(--text); outline: none; text-align: center; transition: border-color 0.2s; }
.num-input:focus { border-color: var(--gold-border); }
.num-label { font-size: 16px; color: var(--muted); }
.mini-progress { margin-top: 10px; }
.mini-bar { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.5s ease; }
.mini-fill.warn { background: var(--yellow); }
.mini-fill.danger { background: var(--red); }
.check-grid { display: flex; flex-direction: column; gap: 8px; }
.check-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2); cursor: pointer; transition: all 0.2s; }
.check-item:hover { border-color: var(--border-gold); }
.check-item.checked { background: var(--green-bg); border-color: rgba(61,186,138,0.4); }
.check-box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; transition: all 0.2s; }
.check-item.checked .check-box { background: var(--green); border-color: var(--green); color: #fff; }
.check-text { flex: 1; font-size: 16px; font-weight: 700; color: var(--text); }
.check-date { font-size: 10px; color: var(--muted); }
.check-item.checked .check-date { color: var(--green); }
.date-mini { font-size: 17px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: 'Noto Sans TC', sans-serif; outline: none; width: 110px; }
.rule-box { background: rgba(201,168,76,0.06); border-radius: 6px; padding: 10px 12px; font-size: 17px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; border-left: 3px solid var(--gold-border); }
.inactive-note { padding: 20px; text-align: center; font-size: 16px; color: var(--muted); }

/* READONLY MODE */
.readonly-notice { background: rgba(230,160,48,0.08); border: 1px solid rgba(230,160,48,0.3); border-radius: 8px; padding: 10px 14px; font-size: 16px; color: var(--yellow); margin: 10px 16px 0; display: flex; align-items: center; gap: 8px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--surface2); color: var(--text); border: 1px solid var(--border-gold); padding: 10px 20px; border-radius: 8px; font-size: 17px; font-weight: 700; z-index: 9999; transition: transform 0.25s ease; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* LOADING */
.loading-wrap { padding: 40px; text-align: center; color: var(--muted); font-size: 17px; }

@keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

<script>
// ============================================================
// CONFIG
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx4RlPROgjqOPWaI76XZ6Lh4kZIQMww5IeiDTIUM2y8VuBGf9OCPWoQHT4JNTl6OOWPYw/exec';

// 這三個現在都由登入後的後端回應動態填入，不再寫死在前端
let MONTHS = [];
let MEMBERS = [];
let isManagerView = false;

const F4_ACTIVITIES = [
  { id: 'M1_H1', label: 'M1 培訓（上半年）', period: '1–6月至少一次' },
  { id: 'M2_H1', label: 'M2 培訓（上半年）', period: '1–6月至少一次' },
  { id: 'M1_H2', label: 'M1 培訓（下半年）', period: '7–12月至少一次' },
  { id: 'M2_H2', label: 'M2 培訓（下半年）', period: '7–12月至少一次' },
  { id: 'ANNUAL', label: '台灣年會 DnA培訓', period: '6/28–6/29' },
];

// ============================================================
// STATE
// ============================================================
let curMonth = '';
let curMember = '';
let sheetData = {}; // sheetData[month][memberId] = {field: value}，sheetData['f4'] = {memberId: {field: value}}
let isReadOnly = true; // always readonly — editing done in Google Sheet

// ============================================================
// 登入
// ============================================================
async function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const btn = document.getElementById('loginBtn');
  if (!name || !password) {
    document.getElementById('pwError').textContent = '請輸入姓名與密碼';
    document.getElementById('pwError').style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = '登入中...';
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'dnaLogin', name, password }) });
    const data = await res.json();
    if (data.status === 'ok') {
      sessionStorage.setItem('dna_token', data.token);
      sessionStorage.setItem('dna_name', data.name);
      sessionStorage.setItem('dna_isManager', data.isManager ? '1' : '0');
      document.getElementById('passwordOverlay').style.display = 'none';
      const bar = document.getElementById('userBar');
      bar.style.display = 'flex';
      document.getElementById('userBarName').textContent = '👤 ' + data.name;
      initApp();
    } else {
      document.getElementById('pwError').textContent = data.message || '帳號或密碼錯誤';
      document.getElementById('pwError').style.display = 'block';
      btn.disabled = false; btn.textContent = '登入 DnA 專區';
    }
  } catch (err) {
    document.getElementById('pwError').textContent = '連線失敗，請稍後再試';
    document.getElementById('pwError').style.display = 'block';
    btn.disabled = false; btn.textContent = '登入 DnA 專區';
  }
}

function doLogout() {
  sessionStorage.removeItem('dna_token');
  sessionStorage.removeItem('dna_name');
  sessionStorage.removeItem('dna_isManager');
  location.reload();
}

// ============================================================
// 向後端要資料（已依登入者權限過濾，只會拿到看得到的人）
// ============================================================
async function loadAllData() {
  setSyncStatus('loading', '正在載入資料...');
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('errorWrap').style.display = 'none';

  const token = sessionStorage.getItem('dna_token');
  if (!token) {
    document.getElementById('passwordOverlay').style.display = 'flex';
    return;
  }

  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'dnaGetAllData', token }) });
    const data = await res.json();

    if (data.status !== 'ok') {
      // token 失效或其他錯誤，退回登入畫面
      setSyncStatus('error', data.message || '連線失敗');
      sessionStorage.removeItem('dna_token');
      document.getElementById('passwordOverlay').style.display = 'flex';
      document.getElementById('pwError').textContent = data.message || '登入已失效，請重新登入';
      document.getElementById('pwError').style.display = 'block';
      return;
    }

    MONTHS = data.months;
    MEMBERS = data.members;
    isManagerView = data.isManager;
    sheetData = {};
    MONTHS.forEach(m => { sheetData[m] = data.monthData[m] || {}; });
    sheetData['f4'] = data.f4Data || {};

    // 預設月份：抓得到今天所屬月份就用，否則用清單裡最後一個月
    const todayMonth = new Date().toISOString().slice(0, 7);
    curMonth = MONTHS.includes(todayMonth) ? todayMonth : MONTHS[MONTHS.length - 1];
    // 預設成員：登入者自己（若管理者視角則挑清單第一位）
    const loginName = data.loginName;
    curMember = MEMBERS.find(m => m.name === loginName) ? MEMBERS.find(m => m.name === loginName).id
              : (MEMBERS[0] ? MEMBERS[0].id : '');

    setSyncStatus('ok', '資料已同步 Google Sheet');
    render();
  } catch (e) {
    setSyncStatus('error', '連線失敗');
    render();
  }
}

function setSyncStatus(status, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if (dot) dot.className = 'sync-dot ' + status;
  if (txt) txt.textContent = text;
}

// ============================================================
// DATA GETTERS
// ============================================================
function getMonthVal(month, memberId, field) {
  return (sheetData[month] && sheetData[month][memberId] && sheetData[month][memberId][field]) || '';
}
function getF4Val(memberId, actId) {
  return (sheetData['f4'] && sheetData['f4'][memberId] && sheetData['f4'][memberId][actId]) || '';
}

// ============================================================
// CALCULATIONS
// ============================================================
function getMemberStartIdx(mid) {
  const m = MEMBERS.find(x => x.id === mid);
  if (!m || !m.startMonth) return 0;
  const idx = MONTHS.indexOf(m.startMonth);
  return idx >= 0 ? idx : 0;
}

// 判斷該成員在指定月份是否「未加入」或「已離開」，兩種情況都視為鎖定
function isMonthLocked(m, month) {
  if (!m) return true;
  if (m.startMonth && month < m.startMonth) return true;
  if (m.endMonth && month > m.endMonth) return true;
  return false;
}

function calcF1(mid) {
  const idx = MONTHS.indexOf(curMonth);
  const startIdx = getMemberStartIdx(mid);
  const start = Math.max(startIdx, idx - 5);
  const absentLabels = [];
  for (let i = start; i <= idx; i++) {
    const v = getMonthVal(MONTHS[i], mid, '地基1');
    if (v === '0') {
      const mNum = parseInt(MONTHS[i].split('-')[1]);
      absentLabels.push(mNum + '月缺席');
    }
  }
  if (absentLabels.length >= 2) return { status: 'danger', label: '注意（' + absentLabels.join('、') + '）' };
  if (absentLabels.length === 1) return { status: 'warn', label: '注意（' + absentLabels[0] + '）' };
  if (getMonthVal(curMonth, mid, '地基1') === '') return { status: 'na', label: '未填寫' };
  return { status: 'ok', label: '達標' };
}

function calcF2(mid) {
  const idx = MONTHS.indexOf(curMonth);
  const startIdx = getMemberStartIdx(mid);
  const start = Math.max(startIdx, idx - 5);
  const missingLabels = [];
  for (let i = start; i <= idx; i++) {
    const v = getMonthVal(MONTHS[i], mid, '地基2');
    if (!v) {
      const mNum = parseInt(MONTHS[i].split('-')[1]);
      missingLabels.push(mNum + '月');
    }
  }
  if (missingLabels.length >= 2) return { status: 'warn', label: '注意（' + missingLabels.join('、') + '未參與）' };
  if (!getMonthVal(curMonth, mid, '地基2')) return { status: 'na', label: '未填寫' };
  return { status: 'ok', label: '已記錄' };
}

function calcF3(mid) {
  const idx = MONTHS.indexOf(curMonth);
  const startIdx = getMemberStartIdx(mid);
  const start = Math.max(startIdx, idx - 5);
  let streak = 0, maxStreak = 0;
  const nonGreenLabels = [];
  const streakLabels = [];
  let tempStreak = [];
  
  for (let i = start; i <= idx; i++) {
    const v = getMonthVal(MONTHS[i], mid, '地基3');
    const mNum = parseInt(MONTHS[i].split('-')[1]);
    if (v && v !== '綠') {
      streak++;
      tempStreak.push(mNum + '月' + v);
      if (streak > maxStreak) {
        maxStreak = streak;
        streakLabels.length = 0;
        streakLabels.push(...tempStreak);
      }
    } else {
      if (v === '綠') streak = 0;
      tempStreak = [];
    }
    if (v && v !== '綠') nonGreenLabels.push(mNum + '月' + v);
  }
  
  if (maxStreak >= 3) return { status: 'danger', label: '注意（連續：' + streakLabels.join('、') + '）' };
  if (maxStreak >= 1) return { status: 'warn', label: '注意（' + nonGreenLabels.join('、') + '）' };
  if (!getMonthVal(curMonth, mid, '地基3')) return { status: 'na', label: '未填寫' };
  return { status: 'ok', label: '達標' };
}

function calcF4(mid) {
  const done = F4_ACTIVITIES.filter(a => getF4Val(mid, a.id) === '1').length;
  if (done === 0) return { status: 'na', label: '未開始' };
  if (done < F4_ACTIVITIES.length) return { status: 'warn', label: `${done}/${F4_ACTIVITIES.length} 完成` };
  return { status: 'ok', label: '全部完成' };
}

function calcF5(mid, month) {
  const m = MEMBERS.find(x => x.id === mid);
  if (!m || !m.hasF5 || m.branches.length === 0) return null;
  let allEmpty = true;
  const details = m.branches.map(b => {
    const actual = parseFloat(getMonthVal(month, mid, `地基5_${b.name}`));
    if (!isNaN(actual)) allEmpty = false;
    const pct = !isNaN(actual) ? Math.round((actual / b.target) * 100) : null;
    return { ...b, actual: isNaN(actual) ? null : actual, pct };
  });
  if (allEmpty) return { status: 'na', label: '未填寫', details };
  const avgPct = details.filter(d => d.pct !== null).reduce((s, d) => s + d.pct, 0) / details.filter(d => d.pct !== null).length;
  if (avgPct < 60) return { status: 'danger', label: `注意（${Math.round(avgPct)}%）`, details };
  if (avgPct < 80) return { status: 'warn', label: `注意中（${Math.round(avgPct)}%）`, details };
  return { status: 'ok', label: `達標（${Math.round(avgPct)}%）`, details };
}

function overallStatus(mid, month) {
  const r1 = calcF1(mid), r2 = calcF2(mid), r3 = calcF3(mid), r4 = calcF4(mid);
  const results = [r1, r2, r3, r4];
  const m = MEMBERS.find(x => x.id === mid);
  if (m.hasF5) { const f5 = calcF5(mid, month); if (f5) results.push(f5); }
  const counted = results.filter(r => r && r.status !== 'na');
  const ok = counted.filter(r => r.status === 'ok').length;
  const total = results.length;
  const hasDanger = results.some(r => r && r.status === 'danger');
  const hasWarn = results.some(r => r && r.status === 'warn');
  let cls = 'ok', statusText = `✓ ${ok}/${total} 達標`;
  if (hasDanger) { cls = 'danger'; statusText = `⚠ 有地基需注意`; }
  else if (hasWarn) { cls = 'warn'; statusText = `！部分地基需注意`; }
  return { ok, total, cls, statusText };
}

// ============================================================
// RENDER
// ============================================================
function render() {
  renderMonths();
  renderMembers();
  renderReadonlyNotice();
  renderOverview();
  renderCards();
}

function renderMonths() {
  document.getElementById('monthBar').innerHTML = MONTHS.map(m => {
    const label = m.replace('-','年') + '月';
    return `<div class="month-tab ${m===curMonth?'active':''}" onclick="setMonth('${m}')">${label}</div>`;
  }).join('');
}

function renderMembers() {
  document.getElementById('memberScroll').innerHTML = MEMBERS.filter(m => !isMonthLocked(m, curMonth)).map(m => {
    return `<button class="member-btn ${m.id===curMember?'active':''}" onclick="setMember('${m.id}')">
      <span class="m-name">${m.name}</span>
      <span class="m-role">${m.role}</span>
    </button>`;
  }).join('');
}

function renderReadonlyNotice() {
  document.getElementById('readonlyNotice').innerHTML = `
    <div class="readonly-notice">
      👁 觀看模式｜資料由辦公室在 Google Sheet 輸入，此頁面自動同步顯示
      <button onclick="loadAllData()" style="margin-left:auto;padding:4px 10px;border-radius:5px;border:1px solid #f59e0b;background:transparent;color:var(--yellow);font-size:11px;cursor:pointer;font-family:'Noto Sans TC',sans-serif">🔄 重新整理</button>
    </div>`;
}

function renderOverview() {
  const m = getMember();
  const locked = isMonthLocked(m, curMonth);
  if (locked) {
    const lockMsg = (m.endMonth && curMonth > m.endMonth)
      ? `🔒 ${m.name} 已於 ${m.endMonth.replace('-','/')} 後離開 DnA`
      : `🔒 ${m.name} 從 ${m.startMonth.replace('-','/')} 起啟用`;
    document.getElementById('overviewWrap').innerHTML = `<div class="inactive-note">${lockMsg}</div>`;
    return;
  }
  const { ok, total, cls, statusText } = overallStatus(curMember, curMonth);
  document.getElementById('overviewWrap').innerHTML = `
    <div class="overview ${cls}" style="margin:14px 16px;">
      <div class="overview-score">${ok}<span>/${total}</span></div>
      <div class="overview-info">
        <div class="overview-name">${m.name}</div>
        <div class="overview-role">${m.role}</div>
        <div class="overview-status">${statusText}</div>
      </div>
    </div>`;
}

function renderCards() {
  const m = getMember();
  const locked = isMonthLocked(m, curMonth);
  if (locked) { document.getElementById('cardsWrap').innerHTML = ''; return; }

  const f1 = calcF1(curMember);
  const f2 = calcF2(curMember);
  const f3 = calcF3(curMember);
  const f4 = calcF4(curMember);
  const f5 = m.hasF5 ? calcF5(curMember, curMonth) : null;

  const f1v = getMonthVal(curMonth, curMember, '地基1');
  const f2v = getMonthVal(curMonth, curMember, '地基2');
  const f3v = getMonthVal(curMonth, curMember, '地基3');

  const bClass = s => s==='ok'?'ok':s==='warn'?'warn':s==='danger'?'danger':'na';

  let cards = [];

  // F1
  cards.push(`<div class="fcard" id="fc1">
    <div class="fcard-head" onclick="toggleCard('fc1')">
      <div class="fcard-num">1</div>
      <div class="fcard-info"><div class="fcard-title">DnA 月會出席</div><div class="fcard-sub">文化濃度</div></div>
      <div class="fcard-badge badge-${bClass(f1.status)}">${f1.label}</div>
      <div class="fcard-chevron">⌄</div>
    </div>
    <div class="fcard-body"><div class="fcard-body-inner">
      <div class="rule-box">滾動式六個月內缺席第二次，進入降責期</div>
      <div class="input-label">本月狀態</div>
      <div class="toggle-row">
        <button class="toggle-btn ${f1v==='1'?'sel-yes':''}" disabled>✅ 有出席</button>
        <button class="toggle-btn ${f1v==='0'?'sel-no':''}" disabled>❌ 未出席</button>
      </div>
      ${!f1v?'<div style="font-size:11px;color:var(--muted);margin-top:8px">尚未填寫</div>':''}
    </div></div>
  </div>`);

  // F2
  cards.push(`<div class="fcard" id="fc2">
    <div class="fcard-head" onclick="toggleCard('fc2')">
      <div class="fcard-num">2</div>
      <div class="fcard-info"><div class="fcard-title">每月基礎性培訓</div><div class="fcard-sub">可複製能力</div></div>
      <div class="fcard-badge badge-${bClass(f2.status)}">${f2.label}</div>
      <div class="fcard-chevron">⌄</div>
    </div>
    <div class="fcard-body"><div class="fcard-body-inner">
      <div class="rule-box">每月任選一場：初進階MSP 或 技巧性工作坊<br>滾動式六個月未參與兩次，進入降責期</div>
      <div class="input-label">本月參加場次</div>
      ${f2v ? `<div style="padding:10px 12px;background:var(--green-bg);border-radius:8px;font-size:13px;color:var(--green);font-weight:700">${f2v}</div>` 
             : `<div style="padding:10px 12px;background:var(--gray-bg);border-radius:8px;font-size:12px;color:var(--gray-text)">尚未填寫</div>`}
    </div></div>
  </div>`);

  // F3
  const lightMap = { '綠':'sel-green', '黃':'sel-yellow', '紅':'sel-red', '灰':'sel-gray' };
  cards.push(`<div class="fcard" id="fc3">
    <div class="fcard-head" onclick="toggleCard('fc3')">
      <div class="fcard-num">3</div>
      <div class="fcard-info"><div class="fcard-title">個人紅綠燈</div><div class="fcard-sub">穩定度 × 示範力</div></div>
      <div class="fcard-badge badge-${bClass(f3.status)}">${f3.label}</div>
      <div class="fcard-chevron">⌄</div>
    </div>
    <div class="fcard-body"><div class="fcard-body-inner">
      <div class="rule-box">連續三個月未達綠燈，進入降責期</div>
      <div class="input-label">本月燈號</div>
      <div class="light-row">
        ${['綠','黃','紅','灰'].map(l=>`<button class="light-btn ${f3v===l?lightMap[l]:''}" disabled>${l==='綠'?'🟢綠燈':l==='黃'?'🟡黃燈':l==='紅'?'🔴紅燈':'⚪灰燈'}</button>`).join('')}
      </div>
      ${!f3v?'<div style="font-size:11px;color:var(--muted);margin-top:8px">尚未填寫</div>':''}
    </div></div>
  </div>`);

  // F4
  const f4checks = F4_ACTIVITIES.map(a => {
    const v = getF4Val(curMember, a.id);
    const checked = v === '1';
    const dateVal = getF4Val(curMember, a.id + '_date');
    return `<div class="check-item ${checked?'checked':''}">
      <div class="check-box">${checked?'✓':''}</div>
      <div style="flex:1">
        <div class="check-text">${a.label}</div>
        <div class="check-date">${a.period}${checked&&dateVal?' ｜ '+dateVal:''}</div>
      </div>
    </div>`;
  }).join('');
  cards.push(`<div class="fcard" id="fc4">
    <div class="fcard-head" onclick="toggleCard('fc4')">
      <div class="fcard-num">4</div>
      <div class="fcard-info"><div class="fcard-title">行為與態度</div><div class="fcard-sub">融入度 × 重要活動</div></div>
      <div class="fcard-badge badge-${bClass(f4.status)}">${f4.label}</div>
      <div class="fcard-chevron">⌄</div>
    </div>
    <div class="fcard-body"><div class="fcard-body-inner">
      <div class="rule-box">M1/M2 上下半年各至少一次 ｜ 台灣年會 6/28–6/29</div>
      <div class="check-grid">${f4checks}</div>
    </div></div>
  </div>`);

  // F5
  if (m.hasF5 && f5) {
    const branchRows = f5.details.map(b => {
      const pct = b.pct !== null ? b.pct : 0;
      const pClass = pct >= 80 ? '' : pct >= 60 ? 'warn' : 'danger';
      const pColor = pct >= 80 ? 'var(--green)' : pct >= 60 ? '#f59e0b' : 'var(--red)';
      return `<div style="margin-bottom:12px">
        <div class="input-label">${b.name}分會 — 目標 ${b.target} 人</div>
        ${b.actual !== null ? `
          <div class="num-row">
            <div style="width:80px;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-size:14px;font-weight:700;text-align:center">${b.actual}</div>
            <span class="num-label">/ ${b.target} 人</span>
            <span style="font-size:12px;font-weight:700;color:${pColor}">${pct}%</span>
          </div>
          <div class="mini-progress"><div class="mini-bar"><div class="mini-fill ${pClass}" style="width:${Math.min(pct,100)}%"></div></div></div>
        ` : '<div style="font-size:12px;color:var(--gray-text);padding:8px 0">尚未填寫</div>'}
      </div>`;
    }).join('');
    cards.push(`<div class="fcard" id="fc5">
      <div class="fcard-head" onclick="toggleCard('fc5')">
        <div class="fcard-num">5</div>
        <div class="fcard-info"><div class="fcard-title">任務與績效</div><div class="fcard-sub">分會人數達成率 ｜ 目標期 4/1–9/30</div></div>
        <div class="fcard-badge badge-${bClass(f5.status)}">${f5.label}</div>
        <div class="fcard-chevron">⌄</div>
      </div>
      <div class="fcard-body"><div class="fcard-body-inner">
        <div class="rule-box">2026/4/1—2026/9/30 目標達成追蹤 ｜ 未達60%進入降責期</div>
        ${branchRows}
      </div></div>
    </div>`);
  }

  document.getElementById('cardsWrap').innerHTML = cards.join('');
}

// ============================================================
// ACTIONS
// ============================================================
function getMember() { return MEMBERS.find(m => m.id === curMember); }
function setMonth(k) { curMonth = k; render(); }
function setMember(id) { 
  console.log('setMember called:', id);
  curMember = id; 
  renderMembers();
  renderOverview();
  renderCards();
}
function toggleCard(id) { const el = document.getElementById(id); if(el) el.classList.toggle('open'); }
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
// INIT
// ============================================================
async function initApp() {
  await loadAllData();
}

// Auto-refresh every 2 minutes（只有登入後才會真的抓資料）
setInterval(() => { if (sessionStorage.getItem('dna_token')) loadAllData(); }, 120000);

// 頁面載入時：如果已經有登入過的 token，直接進系統；否則顯示登入畫面（預設就是顯示的，不用額外處理）
if (sessionStorage.getItem('dna_token')) {
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('passwordOverlay').style.display = 'none';
    const bar = document.getElementById('userBar');
    bar.style.display = 'flex';
    document.getElementById('userBarName').textContent = '👤 ' + sessionStorage.getItem('dna_name');
    initApp();
  });
}
</script>

document.addEventListener('DOMContentLoaded', function() {

  var active = document.querySelector('.nav-btn.active');
  if (nav && active) {
    nav.scrollLeft = active.offsetLeft - (nav.offsetWidth/2) + (active.offsetWidth/2);
  }
