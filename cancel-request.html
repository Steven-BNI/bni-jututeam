<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI 聚團隊｜申請延期</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6R66G555ZY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-6R66G555ZY");
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C96A;
  --gold-dim: rgba(201,168,76,0.15);
  --dark: #0D0D0D;
  --dark2: #161616;
  --dark3: #1F1F1F;
  --border: rgba(201,168,76,0.25);
  --text: #E8E8E0;
  --text-dim: #888;
  --red: #E05252;
  --green: #52C07A;
  --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--dark); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; }

.header { padding: 28px 20px 22px; text-align: center; border-bottom: 2px solid var(--gold); background: linear-gradient(135deg, #0D0D0D 0%, #1a1408 100%); }
.header-eyebrow { font-size: 11px; letter-spacing: 4px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
.header h1 { font-size: 22px; font-weight: 900; color: #fff; }
.header h1 em { color: var(--gold); font-style: normal; }
.header-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

.main { max-width: 520px; margin: 0 auto; padding: 24px 18px 60px; }

.training-card { background: var(--dark2); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; }
.training-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.training-card .value { font-size: 17px; font-weight: 700; color: var(--gold-light); margin-bottom: 10px; }
.training-card .meta { font-size: 13px; color: var(--text-dim); }
.training-card .missing { color: var(--red); font-size: 13px; }

.policy-box { background: var(--dark2); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 24px; font-size: 13px; color: var(--text-dim); line-height: 1.8; }
.policy-box .title { font-weight: 700; color: var(--text); margin-bottom: 8px; font-size: 14px; }

.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.form-label .required { color: var(--red); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--dark2); color: var(--text); font-size: 15px; font-family: 'Noto Sans TC', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-input.error, .form-select.error { border-color: var(--red); }
.form-textarea { resize: vertical; min-height: 80px; }

.btn-primary {
  width: 100%; padding: 15px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: #1a1408; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 8px;
}
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.inline-error { font-size: 13px; color: var(--red); margin-top: 10px; text-align: center; display: none; }

.result-box { display: none; text-align: center; padding: 40px 20px; }
.result-icon { font-size: 48px; margin-bottom: 16px; }
.result-title { font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 10px; }
.result-desc { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
.btn-back { display: inline-block; margin-top: 24px; padding: 13px 28px; border-radius: 10px; background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #1a1408; font-size: 15px; font-weight: 900; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">BNI 聚團隊</div>
  <h1>申請 <em>延期</em></h1>
  <div class="header-sub">新北市西A區｜培訓報名延期申請</div>
</div>

<div class="main">

  <div id="form-view">
    <div class="training-card" id="training-card">
      <!-- 動態填入 -->
    </div>

    <div class="policy-box">
      <div class="title">📌 申請前請先確認</div>
      <div>・延期請於培訓前兩天（最後報名日）前申請，逾期恕不受理。</div>
      <div>・延期僅限一次，且僅能延至費用相同之其他場次，不補繳、不退還差額。</div>
      <div>・姓名與分會需與報名時填寫的完全一致，才能成功送出申請；若查無資料，請確認後重新輸入，或直接聯絡區域辦公室。</div>
    </div>

    <div class="form-group">
      <label class="form-label">姓名<span class="required">*</span></label>
      <input class="form-input" type="text" id="input-name" placeholder="請輸入報名時填寫的姓名">
    </div>

    <div class="form-group">
      <label class="form-label">分會名稱<span class="required">*</span></label>
      <select class="form-select" id="input-chapter">
        <option value="">請選擇分會</option>
        <option value="聚財分會">聚財分會</option>
        <option value="聚大分會">聚大分會</option>
        <option value="聚富分會">聚富分會</option>
        <option value="聚道分會">聚道分會</option>
        <option value="聚安全分會">聚安全分會</option>
        <option value="聚美好分會">聚美好分會</option>
        <option value="聚盛分會">聚盛分會</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">希望改期至</label>
      <select class="form-select" id="input-defer-target">
        <option value="">載入中...</option>
      </select>
      <div id="defer-target-note" style="font-size:12px; color:var(--text-dim); margin-top:6px; display:none;"></div>
    </div>

    <div class="form-group">
      <label class="form-label">申請原因（選填）</label>
      <textarea class="form-textarea" id="input-reason" placeholder="方便的話請簡述原因"></textarea>
    </div>

    <button class="btn-primary" id="btn-submit" onclick="submitRequest()">送出延期申請</button>
    <div class="inline-error" id="inline-error"></div>
  </div>

  <div class="result-box" id="result-view">
    <div class="result-icon">✅</div>
    <div class="result-title">申請已送出</div>
    <div class="result-desc">我們已收到您的延期申請，區域辦公室將於近日主動與您聯繫確認後續處理，感謝您的耐心等候。</div>
    <a href="training.html" class="btn-back">← 返回培訓公告首頁</a>
  </div>

</div>

<script>
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbx4RlPROgjqOPWaI76XZ6Lh4kZIQMww5IeiDTIUM2y8VuBGf9OCPWoQHT4JNTl6OOWPYw/exec',
};

const params = new URLSearchParams(window.location.search);
const training = {
  name: params.get('name') || '',
  date: params.get('date') || '',
  loc:  params.get('loc')  || '',
  fee:  params.get('fee')  || '0',
};

const SHEET_ID = '1JKHpemlHQd_iCp1FpRwyolwL1oL3LNNKtvd5AVEZ-eI';

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseDate(str) {
  // 支援 2026/9/10 或 2026-09-10 等格式
  const m = String(str).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (!m) return null;
  return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
}

async function loadDeferOptions() {
  const select = document.getElementById('input-defer-target');
  try {
    const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent('培訓公告');
    const res  = await fetch(url);
    const text = await res.text();
    const rows = parseCSV(text);
    const headers = rows[0];
    function idx(name) { return headers.indexOf(name); }

    const today = new Date();
    const threeMonthsLater = new Date();
    threeMonthsLater.setMonth(threeMonthsLater.getMonth() + 3);
    const targetFee = parseFloat(training.fee) || 0;

    const options = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || !r[idx('培訓名稱')]) continue;
      const name = (r[idx('培訓名稱')] || '').trim();
      const date = (r[idx('培訓日期')] || '').trim();
      const fee  = parseFloat(r[idx('報名費用')]) || 0;
      if (!name || !date) continue;
      if (name.includes('已取消')) continue;
      if (name === training.name && date === training.date) continue; // 排除自己原本的場次

      const d = parseDate(date);
      if (!d || d < today || d > threeMonthsLater) continue;
      if (fee !== targetFee) continue; // 僅列出費用相同的場次

      options.push({ name, date });
    }

    select.innerHTML = '';
    if (options.length === 0) {
      select.innerHTML = '<option value="">未來三個月內查無相同費用之場次</option>';
      const note = document.getElementById('defer-target-note');
      note.textContent = '目前查無符合條件的場次，請填寫下方原因，或直接聯絡區域辦公室協助安排。';
      note.style.display = 'block';
    } else {
      select.innerHTML = '<option value="">請選擇欲改期之場次</option>';
      options.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.name + '｜' + opt.date;
        el.textContent = opt.name + '　' + opt.date;
        select.appendChild(el);
      });
      const other = document.createElement('option');
      other.value = '__other__';
      other.textContent = '以上皆無合適場次（由辦公室協助安排）';
      select.appendChild(other);
    }
  } catch (err) {
    select.innerHTML = '<option value="">場次資料載入失敗，請於下方原因欄位說明</option>';
    console.error('loadDeferOptions error:', err);
  }
}
loadDeferOptions();

function renderTrainingCard() {
  const card = document.getElementById('training-card');
  if (!training.name || !training.date) {
    card.innerHTML = '<div class="missing">⚠️ 未偵測到培訓場次資訊，請從培訓公告頁面點擊「申請延期」進入，或直接聯絡區域辦公室。</div>';
    document.getElementById('btn-submit').disabled = true;
    return;
  }
  card.innerHTML = `
    <div class="label">申請延期之場次</div>
    <div class="value">${training.name}</div>
    <div class="meta">📅 ${training.date}${training.loc ? '　📍 ' + training.loc : ''}</div>
  `;
}
renderTrainingCard();

async function submitRequest() {
  const errorEl = document.getElementById('inline-error');
  errorEl.style.display = 'none';

  const name        = document.getElementById('input-name').value.trim();
  const chapter      = document.getElementById('input-chapter').value.trim();
  const deferSelect  = document.getElementById('input-defer-target').value;
  const deferTarget  = deferSelect === '__other__' ? '（由辦公室協助安排）' : deferSelect;
  const reason       = document.getElementById('input-reason').value.trim();

  let valid = true;
  [['input-name', name], ['input-chapter', chapter]].forEach(([id, val]) => {
    const el = document.getElementById(id);
    el.classList.toggle('error', !val);
    if (!val) valid = false;
  });

  if (!valid) return;

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '送出中...';

  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'cancelRequest',
        name, chapter,
        training: training.name,
        trainingDate: training.date,
        deferTarget, reason,
      }),
    });
    const data = await res.json();

    if (data.status === 'ok') {
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
    } else {
      errorEl.textContent = data.message || '查無此筆報名資料，請確認姓名與分會是否正確。';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '送出申請';
    }
  } catch (err) {
    errorEl.textContent = '送出失敗，請稍後再試，或直接聯絡區域辦公室。';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '送出申請';
  }
}
</script>
</body>
</html>
