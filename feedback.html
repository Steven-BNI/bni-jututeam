<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D0D0D">
<title>BNI 聚團隊｜會後回饋</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6R66G555ZY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-6R66G555ZY");
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C96A;
  --gold-dim: rgba(201,168,76,0.15);
  --dark: #0D0D0D;
  --dark2: #161616;
  --dark3: #1F1F1F;
  --border: rgba(201,168,76,0.25);
  --text: #E8E8E0;
  --text-dim: #888;
  --red: #E05252;
  --green: #52C07A;
  --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #0D0D0D; color-scheme: dark; }
body { background: var(--dark); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; }

.header { padding: 28px 20px 22px; text-align: center; border-bottom: 2px solid var(--gold); background: linear-gradient(135deg, #0D0D0D 0%, #1a1408 100%); }
.header-eyebrow { font-size: 11px; letter-spacing: 4px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
.header h1 { font-size: 22px; font-weight: 900; color: #fff; }
.header h1 em { color: var(--gold); font-style: normal; }
.header-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

.main { max-width: 560px; margin: 0 auto; padding: 24px 18px 60px; background: var(--dark); }

.training-card { background: var(--dark2); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; }
.training-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.training-card .value { font-size: 17px; font-weight: 700; color: var(--gold-light); margin-bottom: 10px; }
.training-card .meta { font-size: 13px; color: var(--text-dim); }
.training-card .missing { color: var(--red); font-size: 13px; }

.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.form-label .required { color: var(--red); margin-left: 2px; }
.form-label .q-num { color: var(--gold); margin-right: 4px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--dark2); color: var(--text); font-size: 15px; font-family: 'Noto Sans TC', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-input.error, .form-select.error { border-color: var(--red); }
.form-textarea { resize: vertical; min-height: 70px; }

.scale-row { display: flex; flex-wrap: wrap; gap: 6px; }
.scale-btn {
  flex: 1 1 calc(20% - 6px); min-width: 38px; padding: 10px 0; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--dark2); text-align: center; cursor: pointer; transition: all 0.2s;
  font-size: 14px; font-weight: 700; color: var(--text-dim);
}
.scale-btn.selected { border-color: var(--gold); background: var(--gold-dim); color: var(--gold-light); }
.scale-caption { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 6px; }

.checkbox-group { display: flex; flex-direction: column; gap: 10px; }
.checkbox-card {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--dark2); cursor: pointer; transition: all 0.2s;
}
.checkbox-card.selected { border-color: var(--gold); background: var(--gold-dim); }
.checkbox-card input { width: 16px; height: 16px; accent-color: var(--gold); flex-shrink: 0; }
.checkbox-card span { font-size: 14px; color: var(--text); }

.btn-primary {
  width: 100%; padding: 15px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: #1a1408; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 8px;
}
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.inline-error { font-size: 13px; color: var(--red); margin-top: 10px; text-align: center; display: none; }

.result-box { display: none; text-align: center; padding: 40px 20px; }
.result-icon { font-size: 48px; margin-bottom: 16px; }
.result-title { font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 10px; }
.result-desc { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
.btn-back { display: inline-block; margin-top: 24px; padding: 13px 28px; border-radius: 10px; background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #1a1408; font-size: 15px; font-weight: 900; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">BNI 聚團隊</div>
  <h1>會後 <em>回饋</em></h1>
  <div class="header-sub">新北市西A區｜培訓回饋表單</div>
</div>

<div class="main">

  <div id="form-view">
    <div class="training-card" id="training-card">
      <!-- 動態填入 -->
    </div>

    <div class="form-group">
      <label class="form-label">姓名<span class="required">*</span></label>
      <input class="form-input" type="text" id="input-name" placeholder="請輸入報名時填寫的姓名">
    </div>

    <div class="form-group">
      <label class="form-label">分會名稱<span class="required">*</span></label>
      <select class="form-select" id="input-chapter">
        <option value="">請選擇分會</option>
        <option value="聚財分會">聚財分會</option>
        <option value="聚大分會">聚大分會</option>
        <option value="聚富分會">聚富分會</option>
        <option value="聚道分會">聚道分會</option>
        <option value="聚美好分會">聚美好分會</option>
        <option value="聚盛分會">聚盛分會</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label"><span class="q-num">Q1</span>整體滿意度（1~10分）<span class="required">*</span></label>
      <div class="scale-row" id="scale-satisfaction">
        <div class="scale-btn" data-val="1">1</div>
        <div class="scale-btn" data-val="2">2</div>
        <div class="scale-btn" data-val="3">3</div>
        <div class="scale-btn" data-val="4">4</div>
        <div class="scale-btn" data-val="5">5</div>
        <div class="scale-btn" data-val="6">6</div>
        <div class="scale-btn" data-val="7">7</div>
        <div class="scale-btn" data-val="8">8</div>
        <div class="scale-btn" data-val="9">9</div>
        <div class="scale-btn" data-val="10">10</div>
      </div>
      <div class="scale-caption"><span>非常不滿意</span><span>非常滿意</span></div>
    </div>

    <div class="form-group">
      <label class="form-label"><span class="q-num">Q2</span>本次領導團隊培訓，搭配的講義對你使用幫助程度（1~10分）<span class="required">*</span></label>
      <div class="scale-row" id="scale-material">
        <div class="scale-btn" data-val="1">1</div>
        <div class="scale-btn" data-val="2">2</div>
        <div class="scale-btn" data-val="3">3</div>
        <div class="scale-btn" data-val="4">4</div>
        <div class="scale-btn" data-val="5">5</div>
        <div class="scale-btn" data-val="6">6</div>
        <div class="scale-btn" data-val="7">7</div>
        <div class="scale-btn" data-val="8">8</div>
        <div class="scale-btn" data-val="9">9</div>
        <div class="scale-btn" data-val="10">10</div>
      </div>
      <div class="scale-caption"><span>完全沒幫助</span><span>幫助非常大</span></div>
    </div>

    <div class="form-group">
      <label class="form-label"><span class="q-num">Q3</span>印象最深的演練或環節</label>
      <textarea class="form-textarea" id="input-practice" placeholder="方便的話請簡述印象最深的部分"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label"><span class="q-num">Q4</span>如何提升帶動更多夥伴參與</label>
      <textarea class="form-textarea" id="input-participation" placeholder="您的想法或建議"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label"><span class="q-num">Q5</span>培訓的建議</label>
      <textarea class="form-textarea" id="input-time" placeholder="對本次培訓的其他建議"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label"><span class="q-num">Q6</span>是否願意擔任以下角色（可複選）</label>
      <div class="checkbox-group">
        <label class="checkbox-card"><input type="checkbox" value="講師"><span>講師</span></label>
        <label class="checkbox-card"><input type="checkbox" value="統籌"><span>統籌</span></label>
        <label class="checkbox-card"><input type="checkbox" value="DnA"><span>DnA 團隊</span></label>
        <label class="checkbox-card"><input type="checkbox" value="暫不考慮"><span>暫不考慮</span></label>
      </div>
    </div>

    <button class="btn-primary" id="btn-submit" onclick="submitFeedback()">送出回饋</button>
    <div class="inline-error" id="inline-error"></div>
  </div>

  <div class="result-box" id="result-view">
    <div class="result-icon">✅</div>
    <div class="result-title">感謝您的回饋</div>
    <div class="result-desc">您的意見已成功送出，將作為未來培訓優化的重要參考，感謝您的參與！</div>
    <a href="training.html" class="btn-back">← 返回培訓公告首頁</a>
  </div>

</div>

<script>
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbx4RlPROgjqOPWaI76XZ6Lh4kZIQMww5IeiDTIUM2y8VuBGf9OCPWoQHT4JNTl6OOWPYw/exec',
};

const params = new URLSearchParams(window.location.search);
const training = {
  name: params.get('name') || '',
  date: params.get('date') || '',
  loc:  params.get('loc')  || '',
};

function renderTrainingCard() {
  const card = document.getElementById('training-card');
  if (!training.name || !training.date) {
    card.innerHTML = '<div class="missing">⚠️ 未偵測到培訓場次資訊，請從培訓公告頁面點擊「填寫會後回饋」進入，或直接聯絡區域辦公室。</div>';
    document.getElementById('btn-submit').disabled = true;
    return;
  }
  card.innerHTML = `
    <div class="label">回饋場次</div>
    <div class="value">${training.name}</div>
    <div class="meta">📅 ${training.date}${training.loc ? '　📍 ' + training.loc : ''}</div>
  `;
}
renderTrainingCard();

let satisfactionVal = '';
let materialVal = '';

function setupScale(containerId, setter) {
  document.querySelectorAll('#' + containerId + ' .scale-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#' + containerId + ' .scale-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      setter(btn.dataset.val);
    });
  });
}
setupScale('scale-satisfaction', v => satisfactionVal = v);
setupScale('scale-material', v => materialVal = v);

document.querySelectorAll('.checkbox-card').forEach(card => {
  const input = card.querySelector('input');
  card.addEventListener('click', (e) => {
    if (e.target !== input) input.checked = !input.checked;
    card.classList.toggle('selected', input.checked);
  });
});

async function submitFeedback() {
  const errorEl = document.getElementById('inline-error');
  errorEl.style.display = 'none';

  const name    = document.getElementById('input-name').value.trim();
  const chapter = document.getElementById('input-chapter').value.trim();
  const practice = document.getElementById('input-practice').value.trim();
  const timeSuggestion = document.getElementById('input-time').value.trim();
  const participationSuggestion = document.getElementById('input-participation').value.trim();
  const roles = Array.from(document.querySelectorAll('.checkbox-card input:checked')).map(el => el.value);

  let valid = true;
  [['input-name', name], ['input-chapter', chapter]].forEach(([id, val]) => {
    const el = document.getElementById(id);
    el.classList.toggle('error', !val);
    if (!val) valid = false;
  });

  if (!satisfactionVal) {
    alert('請選擇 Q1 整體滿意度');
    valid = false;
  }
  if (!materialVal) {
    alert('請選擇 Q2 講義對您的幫助程度');
    valid = false;
  }

  if (!valid) return;

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '送出中...';

  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitFeedback',
        name, chapter,
        training: training.name,
        trainingDate: training.date,
        satisfaction: satisfactionVal,
        materialHelp: materialVal,
        memorablePractice: practice,
        timeSuggestion, participationSuggestion,
        roles,
      }),
    });
    const data = await res.json();

    if (data.status === 'ok') {
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
    } else {
      errorEl.textContent = data.message || '送出時發生問題，請稍後再試，或直接聯絡區域辦公室。';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '送出回饋';
    }
  } catch (err) {
    errorEl.textContent = '送出失敗，請稍後再試，或直接聯絡區域辦公室。';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '送出回饋';
  }
}
</script>
</body>
</html>
