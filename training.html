<style>
:root {
  --red: #E8001D;
  --bg: #0d0d14;
  --surface: #16161f;
  --border: rgba(255,255,255,0.08);
  --muted: #7a7a99;
  --green: #00d97e;
  --yellow: #ffd94a;
  --gray: #444;
  --gold: #C9A84C;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:#fff; font-family:'Noto Sans TC',sans-serif; min-height:100vh; }
.header { background:linear-gradient(135deg,#0d0d14 0%,#1a0a0f 100%); padding:24px 20px 20px; border-bottom:2px solid var(--red); position:relative; overflow:hidden; }
.header::after { content:'TRAIN'; position:absolute; right:-10px; top:50%; transform:translateY(-50%); font-family:'Oswald',sans-serif; font-size:80px; font-weight:900; color:rgba(232,0,29,0.06); letter-spacing:-2px; }
.header-eyebrow { font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:4px; color:var(--red); margin-bottom:6px; }
h1 { font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:#fff; line-height:1.1; }
h1 em { color:var(--red); font-style:normal; }
.header-sub { font-size: 17px; color:var(--muted); margin-top:4px; }
.nav-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none; }
.nav-bar::-webkit-scrollbar { display:none; }
.nav-btn { padding:8px 14px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size: 16px; font-family:'Noto Sans TC',sans-serif; font-weight:700; cursor:pointer; text-decoration:none; transition:all 0.2s; white-space:nowrap; }
.nav-btn:hover { border-color:var(--red); color:var(--red); }
.nav-btn.active { background:var(--red); border-color:var(--red); color:#fff; }
.sync-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:8px 16px; display:flex; align-items:center; gap:8px; font-size: 17px; color:var(--muted); }
.sync-dot { width:7px; height:7px; border-radius:50%; background:var(--gray); flex-shrink:0; }
.sync-dot.ok { background:var(--green); }
.sync-dot.loading { background:var(--yellow); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.refresh-btn { margin-left:auto; padding:4px 10px; border-radius:5px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size: 17px; font-family:'Noto Sans TC',sans-serif; cursor:pointer; }
.refresh-btn:hover { border-color:var(--red); color:var(--red); }
#mainContent { padding:16px; max-width:900px; margin:0 auto; }
.loading { text-align:center; padding:40px; color:var(--muted); font-size: 17px; }

/* Training card */
.training-card { background:var(--surface); border-radius:12px; padding:20px; margin-bottom:20px; border-left:3px solid var(--border); transition:border-color 0.2s; }
.training-card:hover { border-left-color:var(--red); }
.training-card.featured { border-left-color:var(--yellow); }

.training-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.training-name { font-size:18px; font-weight:700; color:#fff; margin-bottom:4px; }
.training-meta { font-size: 16px; color:var(--muted); }
.training-meta span { margin-right:12px; }

/* Progress bar */
.progress-wrap { margin:14px 0; }
.progress-label { display:flex; justify-content:space-between; font-size: 16px; color:var(--muted); margin-bottom:6px; }
.progress-label strong { color:#fff; }
.progress-bar { background:rgba(255,255,255,0.08); border-radius:99px; height:10px; overflow:hidden; }
.progress-fill { height:100%; border-radius:99px; background:linear-gradient(90deg, var(--red), #ff6b6b); transition:width 0.8s ease; }
.progress-fill.full { background:linear-gradient(90deg, var(--green), #00ff9d); }
.progress-fill.warn { background:linear-gradient(90deg, var(--yellow), #ffb347); }

/* 報名按鈕區 */
.register-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
.fee-info { font-size: 17px; color:var(--muted); }
.fee-info strong { color:var(--gold); font-size:16px; }
.fee-info .fee-free { color:var(--green); font-size: 16px; font-weight:700; }
.btn-register { display:inline-flex; align-items:center; gap:6px; background:linear-gradient(135deg, var(--gold), #E8C96A); color:#000; border:none; border-radius:8px; padding:10px 20px; font-size: 16px; font-weight:700; font-family:'Noto Sans TC',sans-serif; cursor:pointer; text-decoration:none; transition:all 0.2s; white-space:nowrap; }
.btn-register:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(201,168,76,0.35); }
.btn-register:active { transform:translateY(0); }
.btn-register.full { background:linear-gradient(135deg,#444,#555); color:#888; cursor:not-allowed; }
.btn-register.full:hover { transform:none; box-shadow:none; }
.btn-album { display:inline-flex; align-items:center; gap:6px; background:rgba(124,124,255,0.15); color:#7c7cff; border:1px solid rgba(124,124,255,0.35); border-radius:8px; padding:9px 18px; font-size: 16px; font-weight:700; font-family:'Noto Sans TC',sans-serif; cursor:pointer; text-decoration:none; transition:all 0.2s; white-space:nowrap; }
.btn-album:hover { background:rgba(124,124,255,0.25); transform:translateY(-1px); }

/* Guests section */
.guests-title { font-size: 16px; color:var(--yellow); font-weight:700; letter-spacing:2px; margin:16px 0 12px; border-top:1px solid var(--border); padding-top:14px; }
.guests-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.guest-card { background:#1e1e2e; border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.guest-top { display:flex; gap:12px; align-items:flex-start; }
.guest-photo { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--yellow); flex-shrink:0; background:#2a2a3e; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--muted); overflow:hidden; }
.guest-photo img { width:100%; height:100%; object-fit:cover; }
.guest-info { flex:1; }
.guest-name { font-size: 17px; font-weight:700; color:#fff; margin-bottom:2px; }
.guest-topic { font-size: 17px; color:var(--yellow); margin-bottom:4px; }
.guest-intro { font-size: 16px; color:var(--muted); line-height:1.6; }

/* Badge */
.badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size: 17px; font-weight:700; margin-top:8px; }
.badge-general { background:rgba(122,122,153,0.2); color:var(--muted); border:1px solid var(--border); }
.badge-featured { background:rgba(255,217,74,0.15); color:var(--yellow); border:1px solid rgba(255,217,74,0.3); }

/* Month section */
.month-title { font-family:'Oswald',sans-serif; font-size:16px; color:var(--red); margin:24px 0 12px; letter-spacing:2px; display:flex; align-items:center; gap:8px; }
.month-title::after { content:''; flex:1; height:1px; background:var(--border); }
.training-card.expired { position: relative; }
.training-card.expired::after { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.6); border-radius:inherit; pointer-events:none; z-index:1; }
.training-card.expired .album-section { position:relative; z-index:2; }
.training-card.expired .training-name { color: #666; }
.training-card.expired .training-meta { color: #444; }
.training-card.expired .btn-album { background:rgba(124,124,255,0.5); border-color:rgba(124,124,255,0.9); color:#bbbbff; }
.training-card.expired .training-name { color: #888; }
.expired-badge { display:inline-block; background:rgba(255,255,255,0.08); color:#666; font-size:12px; padding:3px 10px; border-radius:20px; margin-left:8px; }
.month-title.expired-month { color: #555; }
.month-title.expired-month::after { background: #333; }

@media (max-width:500px) {
  .guests-grid { grid-template-columns:1fr; }
  .training-header { flex-direction:column; }
  .register-row { flex-direction:column; align-items:flex-start; }
  .btn-register { width:100%; justify-content:center; }
}

/* ── 統一導覽列 ── */
.nav-bar {
  background: #13131a;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  overflow-x: auto;
  scrollbar-width: none;
  position: sticky;
  top: 0;
  z-index: 50;
}
.nav-bar::-webkit-scrollbar { display: none; }
.nav-btn {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: #7a7a99;
  font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.nav-btn:hover { border-color: #E8001D; color: #E8001D; }
.nav-btn.active {
  background: #E8001D;
  border-color: #E8001D;
  color: #fff;
}

</style>
</head>

<div class="sync-bar">
  <div class="sync-dot loading" id="syncDot"></div>
  <span id="syncText">載入資料中...</span>
  <button class="refresh-btn" onclick="loadTraining()">🔄 重新整理</button>
</div>

<div id="mainContent"><div class="loading">載入中...</div></div>

<script>
var SHEET_ID = '1JKHpemlHQd_iCp1FpRwyolwL1oL3LNNKtvd5AVEZ-eI';

function setSyncStatus(s, t) {
  document.getElementById('syncDot').className = 'sync-dot ' + s;
  document.getElementById('syncText').textContent = t;
}

function parseCSV(text) {
  var rows = [];
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var row=[], cur='', inQ=false;
  for (var i=0; i<text.length; i++) {
    var c = text[i];
    if (c==='"') { inQ=!inQ; }
    else if (c===',' && !inQ) { row.push(cur); cur=''; }
    else if (c==='\n' && !inQ) { row.push(cur); rows.push(row); row=[]; cur=''; }
    else { cur+=c; }
  }
  if (cur||row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); });
}

function convertGDriveUrl(url) {
  if (!url || !url.trim()) return '';
  url = url.trim();
  var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match) return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w200';
  match = url.match(/id=([a-zA-Z0-9_-]+)/);
  if (match) return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w200';
  return url;
}

function formatDate(d) {
  if (!d) return '';
  var parts = d.split('/');
  if (parts.length >= 3) return parts[1] + '月' + parts[2] + '日';
  return d;
}

// 判斷是否顯示認證導師費用（MSP相關培訓才有）
var MSP_KEYWORDS = ['初階MSP', '進階MSP', 'MSP'];
function isMSP(name) {
  return MSP_KEYWORDS.some(function(k){ return name.indexOf(k) >= 0; });
}

async function loadTraining() {
  setSyncStatus('loading', '載入資料中...');
  try {
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent('培訓公告');
    var r = await fetch(url);
    var text = await r.text();
    var rows = parseCSV(text);
    renderTraining(rows);
    setSyncStatus('ok', '資料已同步');
  } catch(e) {
    setSyncStatus('error', '載入失敗');
    document.getElementById('mainContent').innerHTML = '<div class="loading">載入失敗，請重新整理</div>';
  }
}

function renderTraining(rows) {
  var headers = rows[0] || [];
  var data = rows.slice(1).filter(function(r){ return r[0] && r[0].trim(); });

  function idx(name) { return headers.indexOf(name); }

  if (data.length === 0) {
    document.getElementById('mainContent').innerHTML = '<div class="loading">目前尚無培訓資料</div>';
    return;
  }

  // 今天日期
  var today = new Date();
  today.setHours(0,0,0,0);

  // 判斷是否過期
  function isExpired(dateStr) {
    if (!dateStr) return false;
    var p = dateStr.split('/');
    if (p.length < 3) return false;
    var d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
    return d < today;
  }

  // Group by month，分未來/過去
  var months = {};
  var monthOrder = [];
  data.forEach(function(row) {
    var date = (row[idx('培訓日期')]||'').trim();
    var parts = date.split('/');
    var monthKey = parts.length >= 2 ? parts[0] + '/' + parts[1] : '其他';
    if (!months[monthKey]) { months[monthKey] = []; monthOrder.push(monthKey); }
    months[monthKey].push(row);
  });

  // 排序：未來月份在前，過去月份在後
  function isEffectivelyDone(r) {
    var name = (r[idx('培訓名稱')]||'').trim();
    return isExpired((r[idx('培訓日期')]||'').trim()) || name.includes('已取消');
  }

  monthOrder.sort(function(a, b) {
    var aExpired = months[a].every(function(r){ return isEffectivelyDone(r); });
    var bExpired = months[b].every(function(r){ return isEffectivelyDone(r); });
    if (aExpired && !bExpired) return 1;
    if (!aExpired && bExpired) return -1;
    return a > b ? 1 : -1;
  });

  var html = '';

  monthOrder.forEach(function(monthKey) {
    var monthRows = months[monthKey];
    var parts = monthKey.split('/');
    var monthLabel = parts.length >= 2 ? parts[0] + ' 年 ' + parts[1] + ' 月' : monthKey;
    var monthExpired = monthRows.every(function(r){ return isEffectivelyDone(r); });
    html += '<div class="month-title' + (monthExpired ? ' expired-month' : '') + '">📅 ' + monthLabel + (monthExpired ? ' <span class="expired-badge">已結束</span>' : '') + '</div>';

    monthRows.forEach(function(row) {
      var date       = (row[idx('培訓日期')]||'').trim();
      var name       = (row[idx('培訓名稱')]||'').trim();
      var location   = (row[idx('地點')]||'').trim();
      var current    = parseFloat(row[idx('報名人數')]) || 0;
      var target     = parseFloat(row[idx('目標人數')]) || 0;
      var feeGeneral = parseFloat(row[idx('報名費用')]) || 0;
      var feeMentor  = parseFloat(row[idx('認證導師費用')]) || 0;
      var g1name  = (row[idx('嘉賓1姓名')]||'').trim();
      var g1photo = convertGDriveUrl((row[idx('嘉賓1照片連結')]||'').trim());
      var g1topic = (row[idx('嘉賓1主題')]||'').trim();
      var g1intro = (row[idx('嘉賓1介紹')]||'').trim().replace(/\n/g,'<br>');
      var g2name  = (row[idx('嘉賓2姓名')]||'').trim();
      var g2photo = convertGDriveUrl((row[idx('嘉賓2照片連結')]||'').trim());
      var g2topic = (row[idx('嘉賓2主題')]||'').trim();
      var g2intro = (row[idx('嘉賓2介紹')]||'').trim().replace(/\n/g,'<br>');
      var albumUrl = (row[idx('活動相簿連結')]||'').trim();
      var hasFeatured = g1name || g2name;
      var pct = target > 0 ? Math.min(100, Math.round(current / target * 100)) : 0;
      var fillClass = pct >= 100 ? 'full' : (pct >= 70 ? 'warn' : '');
      var isFull = target > 0 && current >= target;

      var expired = isExpired(date);
      html += '<div class="training-card' + (hasFeatured ? ' featured' : '') + (expired ? ' expired' : '') + '">';

      // Header
      html += '<div class="training-header">';
      html += '<div>';
      var cancelBadge = name.includes('已取消') ? ' <span style="background:rgba(232,0,29,0.2);color:#ff4444;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;vertical-align:middle;">⚠️ 已取消</span>' : '';
      html += '<div class="training-name">' + name + cancelBadge + '</div>';
      html += '<div class="training-meta">';
      html += '<span>📅 ' + formatDate(date) + '</span>';
      if (location) html += '<span>📍 ' + location + '</span>';
      html += '</div>';
      html += '</div>';
      if (hasFeatured) html += '<span class="badge badge-featured">✨ 特別嘉賓場</span>';
      else html += '<span class="badge badge-general">一般培訓</span>';
      html += '</div>';

      // Progress
      if (target > 0) {
        html += '<div class="progress-wrap">';
        html += '<div class="progress-label"><span>報名進度</span><strong>' + current + ' / ' + target + ' 人（' + pct + '%）</strong></div>';
        html += '<div class="progress-bar"><div class="progress-fill ' + fillClass + '" style="width:' + pct + '%"></div></div>';
        html += '</div>';
      }

      // Guests
      if (hasFeatured) {
        html += '<div class="guests-title">🌟 特別嘉賓介紹</div>';
        html += '<div class="guests-grid">';
        if (g1name) {
          html += '<div class="guest-card"><div class="guest-top">';
          html += '<div class="guest-photo">';
          if (g1photo) html += '<img src="' + g1photo + '" alt="' + g1name + '" onerror="this.parentNode.innerHTML=\'👤\'">';
          else html += '👤';
          html += '</div><div class="guest-info">';
          html += '<div class="guest-name">' + g1name + '</div>';
          if (g1topic) html += '<div class="guest-topic">「' + g1topic + '」</div>';
          html += '</div></div>';
          if (g1intro) html += '<div class="guest-intro">' + g1intro + '</div>';
          html += '</div>';
        }
        if (g2name) {
          html += '<div class="guest-card"><div class="guest-top">';
          html += '<div class="guest-photo">';
          if (g2photo) html += '<img src="' + g2photo + '" alt="' + g2name + '" onerror="this.parentNode.innerHTML=\'👤\'">';
          else html += '👤';
          html += '</div><div class="guest-info">';
          html += '<div class="guest-name">' + g2name + '</div>';
          if (g2topic) html += '<div class="guest-topic">「' + g2topic + '」</div>';
          html += '</div></div>';
          if (g2intro) html += '<div class="guest-intro">' + g2intro + '</div>';
          html += '</div>';
        }
        html += '</div>';
      }

      // ── 報名按鈕區 ──
      var registerUrl = 'register.html'
        + '?name=' + encodeURIComponent(name)
        + '&date=' + encodeURIComponent(date)
        + '&loc='  + encodeURIComponent(location)
        + '&fee='  + feeGeneral
        + '&mfee=' + feeMentor
        + '&type=' + encodeURIComponent(name);

      html += '<div class="register-row">';

      // 費用顯示
      html += '<div class="fee-info">';
      if (feeGeneral > 0) {
        html += '費用：<strong>NT$ ' + feeGeneral.toLocaleString() + '</strong>';
        if (feeMentor > 0 && isMSP(name)) {
          html += '&nbsp;&nbsp;導師：<strong>NT$ ' + feeMentor.toLocaleString() + '</strong>';
        }
      } else {
        html += '<span class="fee-free">✅ 免費活動</span>';
      }
      html += '</div>';

      // 報名按鈕
      if (name.includes('已取消')) {
        html += '<span style="font-size:13px;color:#ff4444;">⚠️ 活動已取消</span>';
      } else if (expired) {
        html += '<span style="font-size:13px;color:#555;">活動已結束</span>';
      } else if (isFull) {
        html += '<a class="btn-register full">⛔ 報名已額滿</a>';
      } else {
        html += '<a href="' + registerUrl + '" class="btn-register">📝 立即報名</a>';
      }

      // 相簿按鈕
      if (albumUrl) {
        html += '<div class="album-section" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">';
        html += '<a href="' + albumUrl + '" target="_blank" class="btn-album">📷 查看活動照片</a>';
        html += '</div>';
      }
      html += '</div>'; // register-row
      html += '</div>'; // training-card
    });
  });

  document.getElementById('mainContent').innerHTML = html;
}

loadTraining();
</script>

document.addEventListener('DOMContentLoaded', function() {

  var active = document.querySelector('.nav-btn.active');
  if (nav && active) {
    var navW = nav.offsetWidth;
    var btnL = active.offsetLeft;

    nav.scrollLeft = btnL - (navW / 2) + (btnW / 2);
  }
});
</script>
