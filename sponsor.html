<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>贊助徵求已結束｜BNI 聚團隊 區域講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#211f1a;--ink-soft:#4a463d;--paper:#f7f2e9;--raised:#fffdf8;--line:#ddd3bf;--gold:#9c6b26;--forest:#3c5240}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2ecdf;--ink-soft:#c9c0ac;--paper:#1c1a16;--raised:#25221c;--line:#3a352b;--gold:#d3a14f;--forest:#9fbd9f}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.8}
.card{max-width:560px;width:100%;background:var(--raised);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:8px;padding:48px 32px;text-align:center}
.tag{font-size:14px;letter-spacing:.3em;color:var(--gold);font-weight:700}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(28px,7vw,40px);line-height:1.3;margin:20px 0 8px}
.theme{font-family:"Noto Serif TC",serif;color:var(--forest);font-weight:700;font-size:18px;margin-bottom:28px}
p{color:var(--ink-soft);font-size:16px;margin-bottom:14px}
.next{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);font-family:"Noto Serif TC",serif;font-weight:700;color:var(--ink);font-size:20px}
.org{margin-top:20px;font-size:14px;color:var(--ink-soft);letter-spacing:.1em}
</style>
</head>
<body>
<main class="card">
<div class="tag">BNI 聚團隊　新北市西A區</div>
<h1>贊助徵求已結束</h1>
<div class="theme">你的生意，下一個突破在哪裡？</div>
<p>感謝所有贊助夥伴的支持與信任，<br>讓這場講座順利完成。</p><p>本次贊助徵求已截止，不再開放。</p>
<div class="next">期待下次，再與您相見。</div>
<div class="org">11/11　台北新板希爾頓酒店</div>
</main>
</body>
</html>
